spring.application.name=ticket-booking-system
server.port=${PORT:8080}

# ---- Database (credentials come from environment variables) ----
# createDatabaseIfNotExist lets MySQL create ticket_booking_db automatically if it is missing.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ticket_booking_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
# "update" creates/alters the tickets table automatically (fine for local development).
# For production use "validate" and manage the schema with SQL scripts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Sample data (development only). Set to true to insert 2 fictional rows if table is empty ----
app.sample-data.enabled=${SAMPLE_DATA:false}
